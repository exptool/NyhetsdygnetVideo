<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressen TV Navigation</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=KQ5qZwOlaNdR&format=png&color=000000" type="image/png">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            width: 100%;
            box-sizing: border-box;
        }
        .button-container button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .button-container button:hover {
            background-color: #004494;
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(0.67);
            transform-origin: top left;
            width: 150%; /* Compensates for scaling */
            height: 150%;
        }
    </style>
    <script>
        function navigateTo(url) {
            document.getElementById('iframe').src = url;
        }

        // Ensure all links in the iframe open in a new tab
        function enableExternalLinks() {
            const iframe = document.getElementById('iframe');
            iframe.addEventListener('load', () => {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const links = iframeDoc.querySelectorAll('a');
                links.forEach(link => {
                    link.setAttribute('target', '_blank');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', enableExternalLinks);
    </script>
</head>
<body>
    <div class="button-container">
        <button onclick="navigateTo('https://www.expressen.se/nyhetsdygnet/?section=/tv/nyheter/')">Nyheter</button>
        <button onclick="navigateTo('https://www.expressen.se/nyhetsdygnet/?section=/tv/sport/')">Sport</button>
        <button onclick="navigateTo('https://www.expressen.se/nyhetsdygnet/?section=/tv/noje/')">Nöje</button>
    </div>
    <div class="iframe-container">
        <iframe id="iframe" src="https://www.expressen.se/nyhetsdygnet/?section=/tv/nyheter/" title="Content"></iframe>
    </div>
</body>
</html>
